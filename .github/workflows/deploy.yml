name: Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-vsh-prod
  AZURE_LOCATION: eastus2
  FUNCTION_APP_NAME: func-vsh-prod
  SWA_NAME: swa-vsh-prod

jobs:
  # Validate code before deployment
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            functions/package-lock.json

      - name: Install and lint web
        working-directory: web
        run: |
          npm ci
          npm run lint

      - name: Install, build, and test functions
        working-directory: functions
        run: |
          npm ci
          npm run build
          npm run test:run

      # Upload built functions as artifact to avoid rebuilding
      - name: Upload functions build
        uses: actions/upload-artifact@v4
        with:
          name: functions-dist
          path: functions/
          retention-days: 1

  # Deploy infrastructure with Bicep (runs in parallel, rarely changes)
  deploy-infra:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read
    outputs:
      functionAppHostname: ${{ steps.deploy.outputs.functionAppHostname }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }} \
            --tags project=video-scavenger-hunt environment=prod

      - name: Deploy Bicep
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          # Note: resetData defaults to false to preserve existing data
          # To reset all data, manually run: az deployment group create ... --parameters resetData=true
          # Then re-seed: curl -X POST https://func-vsh-prod.azurewebsites.net/api/scenarios/seed
          #               curl -X POST https://func-vsh-prod.azurewebsites.net/api/gamekeepers/seed
          parameters: environment=prod customDomain=vsh.k61.dev location=westus2
          failOnStdErr: false

      - name: Configure Function App Settings
        run: |
          STORAGE_NAME=$(az storage account list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          STORAGE_CONN=$(az storage account show-connection-string --name $STORAGE_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query connectionString -o tsv)
          
          az functionapp config appsettings set \
            --name ${{ env.FUNCTION_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings \
              AzureWebJobsStorage="$STORAGE_CONN" \
              AZURE_STORAGE_CONNECTION_STRING="$STORAGE_CONN" \
              AZURE_CLIENT_ID=${{ secrets.ENTRA_CLIENT_ID }} \
              AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Link Function App as SWA Backend
        run: |
          # Get the subscription ID and Function App resource ID
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          FUNC_RESOURCE_ID="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Web/sites/${{ env.FUNCTION_APP_NAME }}"
          
          # Link the Function App as a backend (idempotent - won't fail if already linked)
          az staticwebapp backends link \
            --name ${{ env.SWA_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --backend-resource-id "$FUNC_RESOURCE_ID" \
            --backend-region westus2 \
            2>/dev/null || echo "Backend already linked or linking in progress"

  # Deploy Functions to Azure Function App
  deploy-functions:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download functions build
        uses: actions/download-artifact@v4
        with:
          name: functions-dist
          path: functions

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: functions

  # Deploy Static Web App (frontend only)
  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get SWA deployment token
        id: get-token
        run: |
          SWA_NAME=$(az staticwebapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          TOKEN=$(az staticwebapp secrets list --name $SWA_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        # Note: No VITE_API_BASE_URL needed - SWA linked backend proxies /api/* to Function App
        with:
          azure_static_web_apps_api_token: ${{ steps.get-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          output_location: dist
          config_file_location: /
          skip_api_build: true

  # Run smoke tests after deployment
  smoke-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [deploy-functions, deploy-web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for deployment to propagate
        run: sleep 15

      - name: Run smoke tests
        run: node tests/smoke.js https://vsh.k61.dev
